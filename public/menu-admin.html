<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Menu Admin</title>
    <style>
      body{font-family:Arial, Helvetica, sans-serif; padding:16px}
      table{width:100%;border-collapse:collapse;margin-bottom:16px}
      th,td{border:1px solid #ddd;padding:8px;text-align:left}
      th{background:#f4f4f4}
      .muted{color:#666;font-size:0.9em}
      form > *{display:block;margin:6px 0}
      input[type=text], input[type=number]{width:100%;padding:6px}
      button{padding:8px 12px}
    </style>
  </head>
  <body>
  <h1>แก้ไขเมนู</h1>
  <nav><a href="/plek">หน้าหลัก</a></nav>
  <p>ใช้หน้านี้เพื่อเพิ่ม แก้ไข หรือ ลบรายการเมนู</p>
    <table id="menu-table">
      <thead><tr><th>ID</th><th>ชื่อเมนู</th><th>ราคา</th><th>หมวดหมู่</th><th>แสดงในหน้าสั่งอาหาร</th><th>คำอธิบาย</th><th>คำสั่ง</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2 id="form-title">เพิ่มรายการใหม่</h2>
    <form id="menu-form">
      <input type="hidden" id="m-id" />
      <label>ชื่อเมนู <input id="m-name" type="text" required /></label>
        <label>ราคา <input id="m-price" type="number" step="0.01" required /></label>
        <label>หมวดหมู่ <select id="m-category" required><option value="">(loading...)</option></select></label>
        <label style="display:flex;align-items:center;gap:8px"><strong>แสดงในหน้าสั่งอาหาร</strong>
          <div style="position:relative">
            <input type="checkbox" id="m-available" checked style="width:40px;height:20px;appearance:none;background:#ddd;border-radius:20px;position:relative;outline:none;cursor:pointer" />
            <span style="position:absolute;left:2px;top:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .15s" id="m-available-thumb"></span>
          </div>
        </label>
      <button id="save">บันทึก</button>
      <button id="cancel" type="button">ยกเลิก</button>
    </form>

    <script src="/assets/menu-admin.js"></script>
  </body>
</html>
