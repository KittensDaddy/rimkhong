<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Menu Admin</title>
    <style>
      body{font-family:Arial, Helvetica, sans-serif; padding:16px}
      table{width:100%;border-collapse:collapse;margin-bottom:16px}
      th,td{border:1px solid #ddd;padding:8px;text-align:left}
      th{background:#f4f4f4}
      .muted{color:#666;font-size:0.9em}
      form > *{display:block;margin:6px 0}
      input[type=text], input[type=number]{width:100%;padding:6px}
      button{padding:8px 12px}
    </style>
  </head>
  <body>
    <h1>Menu Admin</h1>
    <p>Use this page to add, edit, or delete menu items.</p>
    <table id="menu-table">
      <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Category</th><th>Description</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2 id="form-title">Add new item</h2>
    <form id="menu-form">
      <input type="hidden" id="m-id" />
      <label>Name <input id="m-name" type="text" required /></label>
        <label>Price <input id="m-price" type="number" step="0.01" required /></label>
        <label>Category <select id="m-category" required><option value="">(loading...)</option></select></label>
        <label>Description <input id="m-desc" type="text" /></label>
        <label><input type="checkbox" id="m-available" checked /> Available (show on customer page)</label>
      <button id="save">Save</button>
      <button id="cancel" type="button">Cancel</button>
    </form>

    <script src="/assets/menu-admin.js"></script>
  </body>
</html>
