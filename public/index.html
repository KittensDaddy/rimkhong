<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เมนู - สั่งอาหาร</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">เมนู</h1>
    <nav></nav>
  </header>

  <main class="container">
    <div class="left-col">
      <section class="category-bar" id="categories"></section>
      <section id="menu-list" class="menu-list"></section>
    </div>
    <aside class="right-col" id="orders-panel">
      <h3>ออเดอร์</h3>
      <div id="cart-placeholder"></div>
      <ul id="placed-orders"></ul>
    </aside>
  </main>

  <aside class="cart" id="cart">
    <h3>ตะกร้า</h3>
    <ul id="cart-items"></ul>
    <div class="cart-footer">
      <div>ยอดรวมในตะกร้า: <span id="cart-total">0.00</span></div>
      <button id="checkout">ส่งรายการ</button>
    </div>
  </aside>

  <script src="/assets/app.js"></script>
</body>
</html>
