<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>การตั้งค่า</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <header class="topbar">
    <h1>การตั้งค่า</h1>
    <nav><a href="/plek">Staff</a></nav>
  </header>
  <main class="container settings">
    <!-- Admin token removed for simplicity; staff access via /plek -->

    <section>
      <h2>Tables</h2>
      <label>จำนวนโต๊ะ: <input id="table-count" type="number" min="1"></label>
      <button id="save-tables">บันทึก</button>
    </section>

    <!-- Menu admin moved to dedicated menu-admin page -->

    <section>
      <h2>Sales Report</h2>
      <button id="refresh-report">Refresh</button>
      <pre id="report-output"></pre>
    </section>
    <section>
      <h2>Table links & QR</h2>
      <div id="table-links"></div>
    </section>
    <section>
      <h2>คิวอาร์ โค๊ดจ่ายเงิน</h2>
      <div id="payment-info">
        <label>เลขบัญชี<input id="pay-name" type="text" /></label>
        <label>ธนาคาร<input id="pay-bank" type="text" /></label>
        <label>อัปโหลดภาพคิวอาร์ (PNG/JPEG) <input id="pay-file" type="file" accept="image/*" /></label>
        <div id="pay-preview"></div>
        <button id="save-pay">บันทึกข้อมูล</button>
      </div>
    </section>
  </main>
  <script src="/assets/settings.js"></script>
</body>
</html>
